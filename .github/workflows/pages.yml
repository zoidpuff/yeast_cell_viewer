# Publish the repository root as the GitHub Pages site.
# Replaces the built-in Pages deploy, which once timed out after 10 minutes while syncing a data rebuild (~6,500
# changed files); this workflow deployed the same commit in 3.5 minutes and can be re-run from the Actions tab.
# Repository setting: Pages -> Source -> GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000    # ms; 10 min is the maximum deploy-pages allows
